<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Page Not Found</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; display:flex; height:100vh; margin:0; align-items:center; justify-content:center; background:#0b1220; color:#e6edf3; }
    .card { max-width: 520px; padding: 32px; border-radius: 18px; background: #111827; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { opacity: .85; }
    a { color: #93c5fd; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404 — Not Found</h1>
    <p>The page you’re looking for doesn’t exist.</p>
    <p><a href="/">Go back home</a></p>
  </div>
</body>
</html>
