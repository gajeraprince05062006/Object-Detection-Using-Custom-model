<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products - TrollyNet.in</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0d;
            color: #e5e7eb;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: #16161e;
            border-bottom: none;
            box-shadow: 0 4px 20px 0 #000d, 0 0 6px 2px #027aff22;
            padding-bottom: 0.2rem;
            margin-bottom: 0;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.4rem 1rem 1rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.6rem;
            background: linear-gradient(90deg, #fc8c77 0%, #1CF2FF 95%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }

        .logo::before {
            content: "🛒";
            margin-right: 8px;
            font-size: 1.3rem;
            filter: drop-shadow(0 2px 6px #1CF2FF44);
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-btn {
            color: #e5e7eb;
            font-size: 1.04rem;
            text-decoration: none;
            background: #17181f;
            border: none;
            border-radius: 1.5rem;
            padding: 0.55rem 1.1rem;
            opacity: 0.96;
            transition: background 0.17s, color 0.17s, box-shadow 0.2s;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-btn:hover {
            background: #26374d;
            color: #1CF2FF;
            box-shadow: 0 4px 16px -6px #1cf2ff33;
            opacity: 1;
        }

        .cart-icon {
            position: relative;
            background: linear-gradient(135deg, #fc8c77, #1CF2FF 70%);
            color: #16161e;
            font-size: 1.35rem;
            padding: 0.85rem;
            border-radius: 50%;
            cursor: pointer;
            transition: filter 0.2s;
            box-shadow: 0 2px 14px -2px #1cf2ff58;
            border: 1.5px solid #222936;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-icon:hover {
            filter: brightness(1.13) drop-shadow(0 0 6px #1CF2FF90);
        }

        /* Banner */
        .promo-banner {
            background: linear-gradient(90deg, #fc8c77, #ffb089 40%, #1CF2FF 95%);
            color: #18191b;
            text-shadow: 0 2px 8px #fff7;
            text-align: center;
            padding: 0.53rem 0;
            font-size: 1.05rem;
            letter-spacing: .5px;
            font-weight: 500;
            box-shadow: 0 2px 12px -4px #ffb08953;
        }

        /* Container */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Page Title */
        .page-title {
            text-align: center;
            padding: 2rem 0 1rem 0;
            margin-bottom: 2rem;
            background: transparent;
            border-bottom: 1.5px solid #232434;
        }
        .page-title h1 {
            font-size: 2.3rem;
            font-weight: 700;
            color: #1CF2FF;
            text-shadow: 0 3px 35px #1CF2FF30, 0 6px 50px #181b25;
            background: linear-gradient(90deg,#fc8c77 10%,#1CF2FF 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 1.2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-filter {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: #15161c;
            color: #e5e7eb;
            border: 1.5px solid #232434;
            border-radius: 1.25rem;
            font-size: 1rem;
            padding: 0.73rem 1.1rem;
            outline: none;
            transition: border .2s, background .2s;
        }

        .search-input:focus {
            background: #181b25;
            border-color: #1CF2FF;
            color: #fff;
        }

        .category-filters {
            display: flex;
            gap: 0.7rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-btn {
            padding: 0.43rem 1.15rem;
            border: 1px solid #1CF2FF55;
            background: #15161c;
            color: #1CF2FF;
            border-radius: 2.8rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.18s, color 0.18s, border-color 0.16s;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #1CF2FF;
            color: #18191b;
            border-color: #fc8c77;
            box-shadow: 0 3px 10px -3px #fc8c7790;
        }

        /* Products Table */
        .products-table-container {
            background: #15161c;
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: 0 4px 22px -4px #090a;
            margin-top: 2rem;
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
        }

        .table-header {
            background: #17181f;
            border-bottom: 1.5px solid #232434;
        }

        .table-header th {
            padding: 1.1rem;
            text-align: left;
            font-weight: 600;
            color: #1CF2FF;
            font-size: 1.03rem;
            letter-spacing: .5px;
        }

        .table-header th:nth-child(2) {
            text-align: center;
        }

        .table-header th:nth-child(3) {
            text-align: center;
        }

        .product-row {
            border-bottom: 1px solid #222435;
            background: none;
            transition: background 0.19s;
        }

        .product-row:hover {
            background: #1a1d24;
        }

        .product-row td {
            padding: 1.2rem 1rem;
            vertical-align: middle;
        }

        .product-name {
            font-weight: 600;
            color: #fff;
            font-size: 1.05rem;
        }

        .product-price {
            text-align: center;
            color: #ff9987;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .add-to-cart-cell {
            text-align: center;
        }

        .add-to-cart-btn {
            background: linear-gradient(90deg, #fc8c77, #1CF2FF 70%);
            color: #181b24;
            padding: 0.67rem 1.2rem;
            border: none;
            border-radius: 1.15rem;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 2px 10px -3px #1CF2FF60;
            cursor: pointer;
            transition: filter 0.14s, background 0.16s;
            min-width: 100px;
        }

        .add-to-cart-btn:hover {
            filter: brightness(1.09) drop-shadow(0 0 6px #fc8c77BB);
            background: linear-gradient(90deg, #fc8c77, #1CF2FF 99%);
            color: #0a1620;
        }

        .add-to-cart-btn:active {
            transform: scale(0.95);
        }

        /* Loading state */
        .add-to-cart-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Success message */
        .success-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(90deg, #fc8c77, #1CF2FF 70%);
            color: #181b24;
            padding: 1rem 1.5rem;
            border-radius: 0.8rem;
            font-weight: 600;
            box-shadow: 0 4px 20px -4px #1CF2FF60;
            transform: translateX(400px);
            transition: transform 0.3s ease-in-out;
            z-index: 1000;
        }

        .success-message.show {
            transform: translateX(0);
        }

        /* Empty state */
        .empty-products {
            text-align: center;
            padding: 4.5rem 0;
            color: #8a96a4;
        }

        .empty-products div {
            font-size: 4rem;
            margin-bottom: 1.1rem;
            color: #444c54;
        }

        .empty-products h3 {
            color: #1CF2FF;
            font-size: 1.5rem;
            margin-bottom: 0.7rem;
        }

        .empty-products p {
            color: #6a7a8b;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: .85rem;
            }
            
            .nav-buttons {
                flex-wrap: wrap;
                justify-content: center;
            }

            .filters {
                flex-direction: column;
                align-items: stretch;
            }

            .search-filter {
                min-width: auto;
                max-width: none;
            }

            .category-filters {
                justify-content: center;
            }

            .products-table {
                font-size: 0.89rem;
            }

            .table-header th,
            .product-row td {
                padding: 0.8rem 0.5rem;
            }

            .product-name {
                font-size: 0.95rem;
            }

            .add-to-cart-btn {
                padding: 0.5rem 0.8rem;
                font-size: 0.9rem;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">TrollyNet.in</div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToCart()">🛒 View Cart</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <div class="page-title">
            <h1>All Products</h1>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="search-filter">
                <input type="text" class="search-input" placeholder="🔍 Search products..." id="productSearch">
            </div>
            <div class="category-filters">
                <button class="category-btn active" onclick="filterByCategory('All', this)">All</button>
                <button class="category-btn" onclick="filterByCategory('Electronics', this)">Electronics</button>
                <button class="category-btn" onclick="filterByCategory('Furniture', this)">Furniture</button>
                <button class="category-btn" onclick="filterByCategory('Lifestyle', this)">Lifestyle</button>
                <button class="category-btn" onclick="filterByCategory('Fitness', this)">Fitness</button>
                <button class="category-btn" onclick="filterByCategory('Appliances', this)">Appliances</button>
            </div>
        </div>

        <!-- Products Table -->
        <div class="products-table-container">
            <table class="products-table">
                <thead class="table-header">
                    <tr>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Add to Cart</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    {% for product in products %}
                    <tr class="product-row" data-category="{{ product.category if product.category else 'Other' }}">
                        <td class="product-name">{{ product.name }}</td>
                        <td class="product-price">₹{{ product.price }}</td>
                        <td class="add-to-cart-cell">
                            <button class="add-to-cart-btn" onclick="addToCart('{{ product.name }}', this)">
                                Add to Cart
                            </button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            
            <!-- Empty state (hidden by default) -->
            <div class="empty-products" id="emptyState" style="display: none;">
                <div>🔍</div>
                <h3>No products found</h3>
                <p>Try adjusting your search or filter criteria</p>
            </div>
        </div>
    </div>

    <!-- Success message (hidden by default) -->
    <div class="success-message" id="successMessage">
        ✅ Product added to cart!
    </div>

    <script>
        let currentCategory = 'All';

        function goToCart() {
            // Redirect to cart page - adjust URL as needed
            window.location.href = '/cart';
        }

        function addToCart(productName, button) {
            // Add loading state
            button.classList.add('loading');
            button.textContent = 'Adding...';
            button.disabled = true;

            // Send request to add product to cart
            fetch(`/add-to-cart/${encodeURIComponent(productName)}`, { 
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(res => res.json())
            .then(data => {
                // Show success message
                showSuccessMessage(data.message || 'Product added to cart!');
                
                // Reset button
                button.classList.remove('loading');
                button.textContent = 'Added ✓';
                button.disabled = false;
                
                // Reset button text after 2 seconds
                setTimeout(() => {
                    button.textContent = 'Add to Cart';
                }, 2000);
            })
            .catch(err => {
                console.error('Error:', err);
                showSuccessMessage('Error adding product to cart', true);
                
                // Reset button
                button.classList.remove('loading');
                button.textContent = 'Add to Cart';
                button.disabled = false;
            });
        }

        function showSuccessMessage(message, isError = false) {
            const messageEl = document.getElementById('successMessage');
            messageEl.textContent = isError ? '❌ ' + message : '✅ ' + message;
            messageEl.style.background = isError ? 
                'linear-gradient(90deg, #ff6b6b, #ff8787)' : 
                'linear-gradient(90deg, #fc8c77, #1CF2FF 70%)';
            
            messageEl.classList.add('show');
            
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 3000);
        }

        function filterByCategory(category, button) {
            currentCategory = category;
            
            // Update active button
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            
            filterProducts();
        }

        function filterProducts() {
            const searchTerm = document.getElementById('productSearch').value.toLowerCase();
            const rows = document.querySelectorAll('.product-row');
            let visibleCount = 0;

            rows.forEach(row => {
                const productName = row.querySelector('.product-name').textContent.toLowerCase();
                const productCategory = row.dataset.category || 'Other';
                
                const matchesSearch = productName.includes(searchTerm);
                const matchesCategory = currentCategory === 'All' || productCategory === currentCategory;
                
                if (matchesSearch && matchesCategory) {
                    row.style.display = '';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });

            // Show/hide empty state
            const emptyState = document.getElementById('emptyState');
            const tableBody = document.getElementById('productsTableBody');
            
            if (visibleCount === 0) {
                tableBody.style.display = 'none';
                emptyState.style.display = 'block';
            } else {
                tableBody.style.display = '';
                emptyState.style.display = 'none';
            }
        }

        // Add search functionality
        document.getElementById('productSearch').addEventListener('input', filterProducts);

        // Add smooth scrolling to top when category changes
        function scrollToProducts() {
            document.querySelector('.products-table-container').scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        }

        // Initialize filters
        document.addEventListener('DOMContentLoaded', function() {
            filterProducts();
        });
    </script>
</body>
</html>
